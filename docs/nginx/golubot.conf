# caremode.ru -> SYNC (порт 3000 на хосте); golubot.online остаётся запасным
# HTTP: ACME + редирект
server {
    listen 80;
    listen [::]:80;
    server_name caremode.ru www.caremode.ru golubot.online www.golubot.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: SYNC
server {
    listen 8444 ssl;
    listen [::]:8444 ssl;
    http2 on;
    server_name caremode.ru www.caremode.ru golubot.online www.golubot.online;

    ssl_certificate     /etc/letsencrypt/live/caremode.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caremode.ru/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL2:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://172.18.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
